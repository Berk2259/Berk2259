name: Generate Snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3286ff

      - name: Slow down animation
        run: |
          sudo chmod -R a+rwX dist
          cat > /tmp/slow_down.py << 'EOF'
          import re
          factor = 3
          paths = [
              "dist/github-contribution-grid-snake.svg",
              "dist/github-contribution-grid-snake-dark.svg",
          ]
          for path in paths:
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              def repl(match):
                  return str(int(int(match.group(1)) * factor)) + "ms"
              content = re.sub(r'([0-9]+)ms', repl, content)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          EOF
          python3 /tmp/slow_down.py

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
